plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

sourceCompatibility = JavaVersion.VERSION_1_8
targetCompatibility = JavaVersion.VERSION_1_8

archivesBaseName = "${mod_id}-${minecraft_version}"
version = "${minecraft_version}-fabric-${mod_version}"
group = "trackapi"

dependencies {
	// Minecraft
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings "net.fabricmc:yarn:${yarn_mappings}:v2"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
	
	// Fabric Loader
	modImplementation "net.fabricmc:fabric-loader:${loader_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "mod_id", project.mod_id
	inputs.property "mod_name", project.mod_name
	inputs.property "mod_description", project.mod_description

	from(sourceSets.main.resources.srcDirs) {
		include "fabric.mod.json"
		expand "version": project.version,
			"minecraft_version": project.minecraft_version,
			"mod_id": project.mod_id,
			"mod_name": project.mod_name,
			"mod_description": project.mod_description
	}

	from(sourceSets.main.resources.srcDirs) {
		exclude "fabric.mod.json"
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-in-gradle/
tasks.withType(JavaCompile) {
	options.encoding = "UTF-8"
}

java {
	withSourcesJar()
}

jar {
	from "LICENSE"
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			artifact remapJar {
				builtBy remapJar
			}
			artifact sourcesJar {
				builtBy remapSourcesJar
			}
		}
	}
	repositories {
		// Add your publish repositories here
		// maven {
		// 	url "sftp://teamopenindustry.cc:22/var/www/html/maven/"
		// 	credentials {
		// 		username = System.getenv("MAVENCI_USER")
		// 		password = System.getenv("MAVENCI_PASS")
		// 	}
		// }
	}
}
